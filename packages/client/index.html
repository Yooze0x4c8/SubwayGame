<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the concrete ground reaches under the notch/home bar;
         safe-area insets are added back where content actually sits.
         interactive-widget=resizes-content makes Chrome/Android shrink the layout
         viewport when the soft keyboard opens, which is what keeps the docked
         입력 field on screen. iOS ignores it — see useAppViewport(). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>타자 EXPRESS! · 지하철 이어가기</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="description" content="지하철 노선을 이어가는 2~8인 실시간 서든데스 게임." />
    <meta name="theme-color" content="#E4E6E1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Pre-paint ground color only, so there is no flash before index.css loads.
         The reset, scrollbars, focus rings and reduced-motion rules all live in
         src/index.css — keeping a second copy here is how they drifted apart. -->
    <style>
      html,
      body {
        margin: 0;
        background: #e4e6e1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
